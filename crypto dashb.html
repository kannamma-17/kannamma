<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Dashboard</title>
    <link rel="stylesheet" href="style 4.css">
</head>
<body>

    <div class="container">
        <h1>🚀 Crypto Dashboard</h1>

        <div class="cards">
            <div class="card">
                <h2>Bitcoin</h2>
                <p id="btc">$0</p>
            </div>

            <div class="card">
                <h2>Ethereum</h2>
                <p id="eth">$0</p>
            </div>

            <div class="card">
                <h2>Dogecoin</h2>
                <p id="doge">$0</p>
            </div>
        </div>

        <button onclick="loadPrices()">Refresh Prices</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
