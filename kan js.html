<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    let a = 1;
    a++
    document.write(a+"<br>");
    ++a
    document.write(a+"<br>");
    a--
    document.write(a+"<br>");
    --a
    document.write(a+"<br>");
    a += 5;
    document.write(a+"<br>");
    let b = 10;
    let c = b++ % 2;
    document.write(c+"<br>");
    document.write(b+"<br>");
    let d = 10;
    let e = ++d % 2;
    document.write(e+"<br>");
    document.write(d+"<br>");
    let f=1,g=2,h=3,i=4
    document.write((f<g && h<i) + "<br>")
    document.write((f<g || h>i) + "<br>")
    document.write(!(f<g) + "<br>")
    let j=5,k=6
    let x=j<k ? "hello" : "world"
    document.write(x + "<br>")
    let y=j>k ? "hello" : "world"
    document.write(y + "<br>")
    
    let l=parseInt(prompt("enter 1st number"))
    let m=parseInt(prompt("enter 2nd number"))
    let o=parseInt(prompt("enter 3rd number"))
    let n=l+m+o
    document.write(n + "<br>")
    
    

    </script>
    
</body>
</html>
